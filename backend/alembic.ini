# Alembic configuration.
#
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale
# encoding (cp949 on Korean Windows), so non-ASCII comments break the CLI.
# Korean notes belong in alembic/env.py, which is read as UTF-8.
#
# sqlalchemy.url is intentionally absent -- alembic/env.py injects it from
# app.config (.env) so the DB URL is defined in exactly one place.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
