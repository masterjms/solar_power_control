[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iotlight-backend"
version = "0.1.0"
description = "태양광 가로등(STM32 + WD-N522S) MQTT 관제 서버 백엔드"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aiomqtt>=2.3",
    "apscheduler>=3.10,<4",
    "python-multipart>=0.0.17",
    # 5차 카카오 로컬 주소 검색 프록시(app/core/kakao_geo.py). 비동기 HTTP 클라이언트.
    "httpx>=0.28",
    # 단말 기록 내보내기 .xlsx (app/modules/device/export.py, 문제점 48번). 순수 파이썬.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

# alembic/ 은 배포 대상이 아니라 마이그레이션 스크립트다. 패키지로 잡지 않는다.
[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"
# app/vendor/ 는 단말·도구와 비트 단위로 같아야 하는 기준 구현 사본이다(docs/spec/ref). 고치지 않는다.
extend-exclude = ["app/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI 의 Depends()/Query() 기본 인자 관용구.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
