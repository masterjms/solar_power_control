# 관리 화면 공통 라우트 — 80(평문) server 와 443(TLS) server 가 같이 include 한다.
# 템플릿이 아니다(envsubst 안 거침). Dockerfile 이 /etc/nginx/iotlight/routes.conf 로 복사한다.
#
# 보호(문제점 16번): 브라우저 Basic auth 창 대신 **로그인 화면 + 세션 쿠키**. 스마트폰 메신저 안 브라우저
# (카카오톡 등)는 Basic auth 입력 창을 띄우지 않고 바로 401 을 보여 줬다.
#   /api/*, /health → auth_request /_auth → backend GET /api/auth/check (쿠키, 또는 스크립트용 Basic 헤더)
#   /api/auth/login·logout → 인증 없이 통과(login 은 IP 당 분당 10회로 제한)
#   정적 파일(SPA) → 공개. 화면 자체에는 비밀이 없고, 데이터는 전부 /api 뒤에 있다.
# 계정은 그대로 .env 의 ADMIN_* / OPERATOR_* (backend 가 판정, core/web_session.py).
#
# 사용자 전달(ADR-005 권한): 통과한 사용자명을 X-Remote-User 로 backend 에 넘긴다.
# proxy_set_header 로 같은 이름을 지정하면 클라이언트가 보낸 X-Remote-User 는 전달되지 않고
# 이 값으로 교체된다(위조 불가). backend 8000 은 호스트에 열지 않으므로 이 헤더를 신뢰한다.

root /usr/share/nginx/html;
index index.html;

client_max_body_size 2m;

gzip on;
gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
gzip_min_length 1024;

# 로그인 판정(내부 전용). 원 요청의 Cookie·Authorization 헤더가 그대로 따라간다.
location = /_auth {
    internal;
    proxy_pass http://backend:8000/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Remote-User "";
}

# 로그인·로그아웃 — 인증 없이 통과. X-Remote-User 는 비워서 보낸다(빈 값 = 헤더 안 보냄).
location = /api/auth/login {
    limit_req zone=iotl_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Remote-User "";
}
location = /api/auth/logout {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Remote-User "";
}

# 브로커 인증 엔드포인트 — 프록시하지 않지만 명시적으로 막아 둔다.
location /internal/ {
    return 404;
}

# 백엔드 (컨테이너 네트워크 안 서비스명). 경로 그대로 전달.
location /api/ {
    auth_request /_auth;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Remote-User $auth_user;
    proxy_read_timeout 60s;
}

# 외부 가동 감시용(docs/04 §11) — 로그인 없이. backend 가 "ok"/"down" 만 돌려준다.
location = /healthz {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Remote-User "";
    proxy_read_timeout 10s;
}

location = /health {
    auth_request /_auth;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Remote-User $auth_user;
}

# Vite 산출물은 파일명에 해시가 붙는다 — 길게 캐시
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# SPA: 없는 경로는 index.html
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
