# 관리 화면 공통 라우트 — 80(평문) server 와 443(TLS) server 가 같이 include 한다.
# 템플릿이 아니다(envsubst 안 거침). Dockerfile 이 /etc/nginx/iotlight/routes.conf 로 복사한다.
#
# 보호: 전 경로 HTTP Basic auth. /api 에 아직 로그인이 없어서(docs/05) 로그인 기능이
# 붙을 때까지의 임시 장치다. 계정은 .env 의 ADMIN_* / OPERATOR_* 로 기동 시 생성(30-htpasswd.sh).
#
# 사용자 전달(ADR-005 권한): 인증된 Basic auth 사용자명을 X-Remote-User 로 backend 에 넘긴다.
# proxy_set_header 로 같은 이름을 지정하면 클라이언트가 보낸 X-Remote-User 는 전달되지 않고
# 이 값으로 교체된다(위조 불가). backend 8000 은 호스트에 열지 않으므로 이 헤더를 신뢰한다.

root /usr/share/nginx/html;
index index.html;

client_max_body_size 2m;

gzip on;
gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
gzip_min_length 1024;

auth_basic "iotlight";
auth_basic_user_file /etc/nginx/.htpasswd;

# 브로커 인증 엔드포인트 — 프록시하지 않지만 명시적으로 막아 둔다.
location /internal/ {
    return 404;
}

# 백엔드 (컨테이너 네트워크 안 서비스명). 경로 그대로 전달.
location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Remote-User $remote_user;
    proxy_read_timeout 60s;
}

location = /health {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Remote-User $remote_user;
}

# Vite 산출물은 파일명에 해시가 붙는다 — 길게 캐시
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# SPA: 없는 경로는 index.html
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
