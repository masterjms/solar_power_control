# iotlight Mosquitto — TLS 부(8883). 4차 MQTTS.
#
# entrypoint.sh 가 /mosquitto/certs/server.crt 와 server.key 가 둘 다 있을 때만
# mosquitto.conf 뒤에 이어붙인다. 인증서가 없는 1차~3차에는 이 리스너가 아예 없다.
#
# 인증서 파일 준비는 docs/04_인프라_운영.md §6 "4차 전환 런북"(infra/scripts/cert-issue.sh, cert-renew.sh).
#   server.crt = Let's Encrypt fullchain.pem (중간 인증서 포함)
#   server.key = privkey.pem, root:1000 0640 — mosquitto 는 권한을 내려놓은 뒤(uid 1000, go-auth 이미지)
#                키를 읽는다. 0600 root 면 "Unable to load server key file" 로 기동 실패(2026-09-27 실측)
# mosquitto 2.0.15 는 이 인증서를 실행 중에 다시 읽지 않는다 — 갱신 반영 = 재시작(ADR-006).

listener 8883
protocol mqtt
# cafile 은 두지 않는다 — 클라이언트 인증서를 검증할 때 쓰는 것인데
# require_certificate false 라 필요 없고, 없는 파일을 가리키면 기동이 실패한다.
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
# 최소 버전이다(2.0.x). 단말은 1.2, PC 도구는 1.3 으로 붙는다(실측).
tls_version tlsv1.2
# 단말 클라이언트 인증서는 쓰지 않는다(사양서 §1.2.2). 신원은 2차 단말별 계정이 담당.
require_certificate false
