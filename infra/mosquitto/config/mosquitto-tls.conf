# iotlight Mosquitto — TLS 부(8883). 4차 MQTTS.
#
# entrypoint.sh 가 /mosquitto/certs/server.crt 와 server.key 가 둘 다 있을 때만
# mosquitto.conf 뒤에 이어붙인다. 인증서가 없는 1차~3차에는 이 리스너가 아예 없다.
#
# 인증서 파일 준비는 docs/04_인프라_운영.md "4차 TLS 전환" 참고.
#   server.crt = Let's Encrypt fullchain.pem (중간 인증서 포함)
#   server.key = privkey.pem, 컨테이너 안 mosquitto(uid 1883) 가 읽을 수 있어야 한다

listener 8883
protocol mqtt
# cafile 은 두지 않는다 — 클라이언트 인증서를 검증할 때 쓰는 것인데
# require_certificate false 라 필요 없고, 없는 파일을 가리키면 기동이 실패한다.
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2
# 단말 클라이언트 인증서는 쓰지 않는다(사양서 §1.2.2). 신원은 2차 단말별 계정이 담당.
require_certificate false
