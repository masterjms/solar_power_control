# iotlight Mosquitto — 기본부(평문 1883). 1차~3차 시험 단말과 백엔드가 쓴다.
#
# 이 파일은 그대로 mosquitto 에 넘기지 않는다. entrypoint.sh 가
#   이 파일 (+ 인증서가 있으면 mosquitto-tls.conf)
# 을 이어붙여 /mosquitto/data/mosquitto.effective.conf 를 만들고 그걸로 기동한다.
# mosquitto 에는 조건부 include 가 없어서, 8883 리스너를 별도 파일로 떼어 두고
# /mosquitto/certs/server.crt 가 있을 때만 붙인다(없으면 certfile 오류로 기동 실패).
#
# 이미지는 iegomez/mosquitto-go-auth (Mosquitto 2.0.x + go-auth 플러그인, ADR-003).
# 인증·권한은 password_file/acl_file 이 아니라 아래 plugin 블록이 담당한다.
# 두 리스너 공통이다(per_listener_settings 안 씀).

# 평문. 1차~3차: 시험 단말(SG 에서 접속원 IP 제한). 4차 이후: 컨테이너 안 백엔드만.
listener 1883
protocol mqtt

allow_anonymous false

# ── 인증·권한: mosquitto-go-auth ─────────────────────────────────────
# files : 서버 계정 `server`, 1차 공용 `solarlte-test` — passwd/aclfile 은 백엔드가
#         내보내고 entrypoint 감시 루프가 /mosquitto/data/ 로 설치한다(형식은 go-auth
#         PBKDF2, entrypoint.sh 주석 참고). aclfile 에는 pattern 줄을 두지 않는다.
# http  : 단말 UUID 계정. 백엔드 /internal/mqtt/{auth,acl,superuser} 가 HMAC 을 계산해
#         200/403 으로 답한다(docs/05 "브로커 인증"). backends 순서대로 시도해 하나라도
#         허용하면 통과 — files 에 없는 username 은 http 로 넘어간다.
#         ⚠ go-auth 는 SIGHUP 으로 passwd/aclfile 을 다시 읽지 않는다(플러그인의
#         security_init(reload) 가 빈 함수, 2026-09-26 실측). 그래서 entrypoint 감시 루프는
#         generated 가 바뀌면 HUP 대신 브로커를 재시작한다(compose restart 정책이 되살린다).
# 캐시  : 인증·ACL 결과를 600초(+지터 30초) 기억한다. 1만 대 재접속 폭주 때 HTTP 호출을
#         줄이고, 백엔드가 잠깐 죽어도 캐시된 단말은 붙는다. 백엔드가 죽어 있으면
#         캐시 안 된 단말의 신규 접속은 거부된다(ADR-003 결과).
plugin /mosquitto/go-auth.so
auth_opt_backends files, http
auth_opt_hasher pbkdf2
auth_opt_files_password_path /mosquitto/data/passwd
auth_opt_files_acl_path /mosquitto/data/aclfile
auth_opt_http_host backend
auth_opt_http_port 8000
auth_opt_http_getuser_uri /internal/mqtt/auth
auth_opt_http_superuser_uri /internal/mqtt/superuser
# superuser 는 쓰지 않는다(백엔드 URI 는 항상 403). 검사 자체를 꺼서 접속·ACL 마다 가던
# HTTP 호출 하나와 "error code: 403" 로그를 없앤다.
auth_opt_disable_superuser true
auth_opt_http_aclcheck_uri /internal/mqtt/acl
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_timeout 5
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_auth_cache_seconds 600
auth_opt_acl_cache_seconds 600
auth_opt_auth_jitter_seconds 30
auth_opt_acl_jitter_seconds 30
auth_opt_log_level info

# retained REGISTER_ACK(3차, 유일한 retain) 가 재시작을 넘겨 살아남아야 한다.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# 이 두 값은 사실상 **백엔드 구독자** 한도다. 단말은 Clean Session=1 이라 오프라인 큐가
# 아예 안 생기고, 단말로 가는 QoS1 은 한 번에 몇 건이다.
# 반면 재접속 폭주 때 1만 대의 REGISTER+TM 이 백엔드 한 연결로 몰린다. 200/40 이던 aircast
# 값으로는 1,000대 폭주에서 "Outgoing messages are being dropped for client iotlight-backend"
# 가 실제로 났다(2026-09-25 S2-10). 메모리는 메시지당 수백 B 라 10,000 이어도 수 MB 다.
max_queued_messages 10000
max_inflight_messages 200

# 접속/해제 로그를 켠다 — 1차 판정 근거이자, 3차 Online/Offline 의 근거(ADR-004).
# stderr(docker logs) 와 함께 공유 볼륨의 파일에도 쓴다. stdout 이 아니라 stderr 인 이유:
# 이 이미지의 mosquitto 는 tty 없이 돌면 stdout 을 블록 버퍼링해 docker logs 에 줄이
# 한참 뒤에야 나타난다(2026-09-26 실측). stderr 는 버퍼링이 없다. 백엔드가 그 파일을
# /var/lib/iotlight/mqtt/mosquitto.log 로 tail 해 `New client connected` / `disconnected`
# 를 읽는다. 파일 회전은 entrypoint 감시 루프(50 MB 넘으면 truncate + HUP).
connection_messages true
log_dest stderr
log_dest file /mosquitto/dynamic/mosquitto.log
log_type notice
log_type warning
log_type error
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
