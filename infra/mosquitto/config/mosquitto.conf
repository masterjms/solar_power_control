# iotlight Mosquitto — 기본부(평문 1883). 1차~3차 시험 단말과 백엔드가 쓴다.
#
# 이 파일은 그대로 mosquitto 에 넘기지 않는다. entrypoint.sh 가
#   이 파일 (+ 인증서가 있으면 mosquitto-tls.conf)
# 을 이어붙여 /mosquitto/data/mosquitto.effective.conf 를 만들고 그걸로 기동한다.
# mosquitto 에는 조건부 include 가 없어서, 8883 리스너를 별도 파일로 떼어 두고
# /mosquitto/certs/server.crt 가 있을 때만 붙인다(없으면 certfile 오류로 기동 실패).
#
# 인증(passwd)·권한(aclfile)은 두 리스너 공통이다(per_listener_settings 안 씀).
# 파일 위치는 /mosquitto/data — config 디렉터리는 :ro 마운트라 런타임 갱신이 안 된다.
# 백엔드가 단말별 계정을 내보내면 entrypoint 감시 루프가 이쪽으로 설치하고 SIGHUP 한다.
# 첫 기동엔 /mosquitto/config/passwd, /mosquitto/config/aclfile(시드)을 복사해 시작한다.

# 평문. 1차~3차: 시험 단말(SG 에서 접속원 IP 제한). 4차 이후: 컨테이너 안 백엔드만.
listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/aclfile

# retained REGISTER_ACK(3차, 유일한 retain) 가 재시작을 넘겨 살아남아야 한다.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# QoS1 미전달 메시지를 오프라인 단말당 무한정 쌓지 않는다(1만 대 × 메모리 보호).
# cmd 는 retain 하지 않으므로 오래 꺼진 단말에 옛 명령이 몰려가는 일도 이걸로 막힌다.
max_queued_messages 200
max_inflight_messages 40

# 1차 합격 판정이 "브로커 로그에 24자리 UUID Client ID" 다. 접속/해제 로그를 켠다.
connection_messages true
log_dest stdout
log_type notice
log_type warning
log_type error
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
