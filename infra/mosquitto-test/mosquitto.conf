# iotlight 시험 브로커 (4차 이후 호스트 1883, docker-compose.tls.yml 의 mosquitto-test, ADR-006).
#
# 사양서 §1.2.2: "시험 Broker(1883)와 운영 Broker(8883) 분리. 시험 Broker 는 유지하되 운영 단말
# 계정을 두지 않는다." — 그래서 인증 플러그인(go-auth·HMAC)이 없는 순정 eclipse-mosquitto 에
# 공용 시험 계정 solarlte-test 하나만 둔다. 운영 단말(UUID + HMAC)·server 계정은 여기서 전부 거부된다.
#
# backend 는 이 브로커에 붙지 않는다. PC 시험 도구·1차 방식 레거시 시험 전용이다.
# 그래서 여기로 보낸 REGISTER 등에는 서버가 응답하지 않는다(운영 DB 와 무관).

listener 1883
protocol mqtt

allow_anonymous false
# 둘 다 entrypoint.sh 가 기동 때마다 만든다 — passwd 는 solarlte-test 한 줄(리포에 비밀번호
# 파일을 두지 않는다), aclfile 은 /mosquitto-test/aclfile 사본(소유 mosquitto 0600).
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/aclfile

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

connection_messages true
log_dest stderr
log_type notice
log_type warning
log_type error
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
